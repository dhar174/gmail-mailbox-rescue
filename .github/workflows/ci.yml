name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xinerama0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint with Ruff
        run: ruff check .

      - name: Run tests with pytest
        run: pytest -v

  macos:
    name: macOS ${{ matrix.arch }} tests and package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
            python_arch: arm64
          - os: macos-15-intel
            arch: x86_64
            python_arch: x64
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          architecture: ${{ matrix.python_arch }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check .
      - name: Full pytest suite
        run: python -m pytest -v
      - name: Source GUI initialization (offscreen, no OAuth)
        run: |
          python - <<'PY'
          from PySide6.QtCore import QTimer
          from PySide6.QtWidgets import QApplication
          from mailbox_rescue.config import AppPaths
          from mailbox_rescue.ui.main_window import MainWindow
          app = QApplication([])
          paths = AppPaths.discover()
          window = MainWindow(paths)
          window.show()
          QTimer.singleShot(500, app.quit)
          assert app.exec() == 0
          assert not paths.token_file.exists()
          print("PASS: source GUI initialized offscreen; no live OAuth/export tested")
          print(f"platformdirs token location (no token created): {paths.token_file}")
          PY
      - name: Build and verify generic macOS ZIP
        run: ./scripts/build-macos.sh --clean
      - name: Launch extracted packaged app with native macOS UI (no OAuth)
        timeout-minutes: 2
        run: |
          extraction="$RUNNER_TEMP/Mailbox Rescue Packaged Test"
          mkdir -p "$extraction"
          ditto -x -k dist/macos/releases/Mailbox-Rescue-v*-macos-${{ matrix.arch }}.zip "$extraction"
          app="$extraction/Mailbox Rescue/Mailbox Rescue.app"
          swiftc scripts/check-macos-window.swift -o "$RUNNER_TEMP/check-macos-window"
          env -u QT_QPA_PLATFORM /usr/bin/open -n \
            --stdout "$RUNNER_TEMP/packaged-startup.stdout" \
            --stderr "$RUNNER_TEMP/packaged-startup.stderr" "$app"
          "$RUNNER_TEMP/check-macos-window" "$app" "$RUNNER_TEMP/packaged-macos-window.png"
      - name: Packaged startup diagnostics (generic app, no credentials)
        if: failure()
        run: |
          for log in "$RUNNER_TEMP/packaged-startup.stdout" "$RUNNER_TEMP/packaged-startup.stderr"; do
            if [[ -f "$log" ]]; then cat "$log"; fi
          done
      - name: Upload packaged startup screenshot (disconnected app only)
        uses: actions/upload-artifact@v7
        with:
          name: Mailbox-Rescue-macos-${{ matrix.arch }}-startup-evidence
          path: ${{ runner.temp }}/packaged-macos-window.png
          if-no-files-found: error
      - name: Upload generic ZIP only (no OAuth or mailbox data)
        uses: actions/upload-artifact@v7
        with:
          name: Mailbox-Rescue-macos-${{ matrix.arch }}
          path: dist/macos/releases/Mailbox-Rescue-v*-macos-${{ matrix.arch }}.zip
          if-no-files-found: error
          compression-level: 0
